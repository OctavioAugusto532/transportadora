<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="registerStyling.css" />
    <title>Cadastro</title>
</head>
<body>
    <div class="cadastro-container">
        <h1>Cadastre-se Aqui</h1>
        <div class="logo">
            <p>Carga<span class="emphasis">Byte</span></p>
        </div>
        <p class="message">Estamos felizes em tê-lo(a) conosco!</p>
        <hr>
        <form action="/register" method="post">
            <label for="username">Usuário:</label>
            <input type="text" id="username" name="username" placeholder="Informe seu nome de usuário" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Informe seu email" required>
            <label for="confirm_email">Confirmar Email:</label>
            <input type="email" id="confirm_email" name="confirm_email" placeholder="Confirme seu email" required>

            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" placeholder="Informe sua senha" required>
            <label for="confirm_password">Confirmar Senha:</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirme sua senha" required>

            <button type="submit">Registrar</button>

            <div class="login-link">
    <a href="login.html">
        <span>Já tem uma conta?</span>
        <span>Faça login aqui</span>
    </a>
</div>
        </form>
    </div>
</body>
</html>
