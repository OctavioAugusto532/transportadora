<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="container">

        <div class="login-section">

            <div class="login-content">

                <!-- CARD LOGIN -->
                <div class="card">

                    <h2 class="card-title">Bem-vindo de volta</h2>
                    <p class="card-description">Entre com suas credenciais</p>

                    <form class="form">

                        <div class="form-group">
                            <label class="label">E-mail</label>
                            <input type="email" class="input" placeholder="seu@email.com">
                        </div>

                        <div class="form-group">

                            <div class="password-label-row">
                                <label class="label">Senha</label>

                                <a href="forgot-password.html" class="forgot-password">
                                    Esqueceu a senha?
                                </a>
                            </div>

                            <input type="password" class="input" placeholder="••••••••">

                        </div>

                        <button class="btn-submit">Entrar</button>

                    </form>

                    <!-- CADASTRO -->
                    <div class="signup-link">
                        <span class="signup-text">Não tem uma conta?</span>
                        <a href="register.html" class="signup-link-text">Se cadastre</a>
                    </div>

                </div>

                <!-- FEATURES -->
                <div class="features">

                    <div class="feature-item">
                        <div class="feature-icon">🚚</div>
                        <p class="feature-text">Rastreamento em tempo real</p>
                    </div>

                    <div class="feature-item">
                        <div class="feature-icon">📦</div>
                        <p class="feature-text">Gestão de entregas</p>
                    </div>

                    <div class="feature-item">
                        <div class="feature-icon">🔒</div>
                        <p class="feature-text">Segurança garantida</p>
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
